# Slots 09..20 are intentionally free for user-defined gateways.

# GUI / playback settings
# One font size is used in every screen layout. Range: 8..24.
font.size=14

# Preferred video stream height in pixels. Default: 360.
# 360 uses the safest single muxed stream. Any manually selected other height
# enables experimental separate video + audio playback with muxed fallback.
video.height=360

# Player mode: auto, mplayer, system or custom.
# auto searches beside NOS-Pipe.jar for mplayer.exe on Windows, mplayer~.x86
# on Intel Mac, mplayer~.ppc on PowerPC Mac, or mplayer on other Unix systems.
# Without the matching executable it opens the safe muxed stream with the OS.
player.mode=auto

# Used only in custom mode. {video} and {audio} are separate arguments.
# Example: mplayer -audiofile {audio} {video}
# VLC standard Windows path, muxed stream:
# player.command="C:\Program Files\VideoLAN\VLC\vlc.exe" {video}
# VLC standard Windows path, separate video and audio streams:
# player.command="C:\Program Files\VideoLAN\VLC\vlc.exe" --input-slave={audio} {video}
player.command=

# Last successfully launched video. Empty means show Popular at startup.
last.video.id=
